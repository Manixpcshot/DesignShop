name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Engine smoke tests
        run: npm test
      - name: SSR render tests
        run: npm run test:ssr
      - name: Production build
        run: npm run build
      - name: Bundle size report
        run: du -sh dist && find dist -name '*.js' -size +2M | head

  lint:
    name: Syntax & sanity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Parse every source file
        run: node scripts/check-sources.mjs
      - name: Verify i18n key parity
        run: node scripts/check-i18n.mjs
      - name: Verify icon set exists
        run: node scripts/check-assets.mjs

  rust:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: cargo fmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
        continue-on-error: true
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
