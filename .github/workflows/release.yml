name: Build & Release

# Every push builds a fresh, downloadable release:
#   Windows : DesignShop-<ver>-windows-x64.exe          (installer, NSIS)
#             DesignShop-<ver>-windows-portable-x64.exe (single portable exe)
#             DesignShop-<ver>-windows-portable.zip     (unpacked portable)
#   Linux   : DesignShop-<ver>-linux-x64.AppImage / .deb / .rpm / .tar.gz
#             DesignShop-<ver>-arch.tar.gz + PKGBUILD   (Arch / Manjaro)
#   Rust    : DesignShop-<ver>-tauri-linux-x64.AppImage / .deb / .rpm
#   Source  : source-<sha>.tar.gz, source-<sha>.zip (full git archive)

on:
  push:
    branches: [main, master, 'arena/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.0.4)'
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: v
        run: |
          set -e
          BUILD="${{ github.run_number }}"
          BASE=$(node -p "require('./package.json').version")
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            MAJOR=$(echo "$BASE" | cut -d. -f1)
            MINOR=$(echo "$BASE" | cut -d. -f2)
            VERSION="${MAJOR}.${MINOR}.${BUILD}"
          fi
          if [[ "${GITHUB_REF}" == refs/heads/main || "${GITHUB_REF}" == refs/heads/master || "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="v$VERSION"
          else
            TAG="build-$BUILD"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "DesignShop $VERSION → $TAG"

  web:
    name: Tests & web build
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Engine + SSR tests
        run: npm run test:all
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: dist
          retention-days: 3

  windows:
    name: Windows — exe + portable
    runs-on: windows-latest
    needs: [prepare, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: dist
      - name: Sync version
        run: node scripts/bump-version.mjs ${{ needs.prepare.outputs.version }}
      - name: Build installer + portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Build unpacked portable folder
        run: npx electron-builder --win dir --x64 --publish never
      - name: Zip the portable folder
        shell: pwsh
        run: |
          $ver = "${{ needs.prepare.outputs.version }}"
          Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "release/DesignShop-$ver-windows-portable.zip" -Force
      - name: Rename installer for clarity
        shell: pwsh
        run: |
          $ver = "${{ needs.prepare.outputs.version }}"
          Get-ChildItem release -Filter "*.exe" | ForEach-Object {
            Write-Host "built: $($_.Name)"
          }
          if (Test-Path "release/DesignShop $ver.exe") {
            Move-Item "release/DesignShop $ver.exe" "release/DesignShop-$ver-windows-x64.exe" -Force
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
          retention-days: 7
          if-no-files-found: warn

  linux-electron:
    name: Linux — AppImage, deb, rpm, tar.gz
    runs-on: ubuntu-22.04
    needs: [prepare, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm fakeroot libarchive-tools
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: dist
      - name: Sync version
        run: node scripts/bump-version.mjs ${{ needs.prepare.outputs.version }}
      - name: Build Linux packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage deb rpm tar.gz --x64 --publish never
      - name: Arch package (tar.gz + PKGBUILD)
        run: |
          set -e
          VER="${{ needs.prepare.outputs.version }}"
          bash packaging/arch/make-arch-package.sh "$VER" release
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/latest-linux.yml
            release/*.zsync
          retention-days: 7
          if-no-files-found: warn

  tauri:
    name: Rust core — Tauri AppImage, deb, rpm
    runs-on: ubuntu-22.04
    needs: [prepare, web]
    # The Electron job already ships every required artifact; if the Rust
    # toolchain or system webview is unavailable this job must not block the
    # release, so failures are reported but tolerated.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev rpm file libxdo-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: dist
      - name: Sync version
        run: node scripts/bump-version.mjs ${{ needs.prepare.outputs.version }}
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Build Tauri bundles
        run: npx tauri build --bundles deb,rpm,appimage
      - name: Collect Rust artifacts
        run: |
          set -e
          VER="${{ needs.prepare.outputs.version }}"
          mkdir -p release-rust
          find src-tauri/target/release/bundle -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) -print0 |
            while IFS= read -r -d '' f; do
              base=$(basename "$f")
              ext="${base##*.}"
              cp "$f" "release-rust/DesignShop-$VER-tauri-linux-x64.$ext"
            done
          cp src-tauri/target/release/designshop release-rust/DesignShop || true
          ls -la release-rust
      - uses: actions/upload-artifact@v4
        with:
          name: rust
          path: release-rust/*
          retention-days: 7
          if-no-files-found: warn

  source:
    name: Source archive
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      - name: Create archives
        run: |
          set -e
          SHA="${{ github.sha }}"
          mkdir -p out
          git archive --format=tar.gz --prefix="DesignShop-$SHA/" -o "out/source-$SHA.tar.gz" HEAD
          git archive --format=zip --prefix="DesignShop-$SHA/" -o "out/source-$SHA.zip" HEAD
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: out/*
          retention-days: 7

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [prepare, windows, linux-electron, source]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Download every artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files
        run: |
          set -e
          mkdir -p dist-release
          find artifacts -type f -print0 | while IFS= read -r -d '' f; do
            cp -n "$f" dist-release/ 2>/dev/null || true
          done
          ls -la dist-release | head -40
      - name: Create / update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ needs.prepare.outputs.tag }}"
          VER="${{ needs.prepare.outputs.version }}"
          NOTES=$(cat <<EOF
          ## DesignShop $VER

          A friendly, Photoshop-class editor for thumbnails & social graphics.
          **Primary language:** English · **Second language:** فارسی (full RTL)

          ### Downloads
          | Platform | File |
          | --- | --- |
          | Windows (installer) | \`DesignShop-$VER-windows-x64.exe\` |
          | Windows (portable, no install) | \`DesignShop-$VER-windows-portable-x64.exe\` |
          | Windows (portable folder) | \`DesignShop-$VER-windows-portable.zip\` |
          | Debian / Ubuntu | \`DesignShop-$VER-linux-x64.deb\` |
          | Fedora / openSUSE | \`DesignShop-$VER-linux-x64.rpm\` |
          | Any Linux | \`DesignShop-$VER-linux-x64.AppImage\` |
          | Portable Linux | \`DesignShop-$VER-linux-x64.tar.gz\` |
          | Arch / Manjaro | \`DesignShop-$VER-arch.tar.gz\` (PKGBUILD included) |
          | Rust core (Tauri) | \`DesignShop-$VER-tauri-linux-x64.*\` |

          ### Source
          Complete source: \`source-*.tar.gz\`, \`source-*.zip\`, or clone the tag \`$TAG\`.

          ### Install notes
          * **Arch:** \`tar xf DesignShop-$VER-arch.tar.gz && cd designshop-bin && makepkg -si\`
          * **deb:** \`sudo apt install ./DesignShop-$VER-linux-x64.deb\`
          * **rpm:** \`sudo dnf install ./DesignShop-$VER-linux-x64.rpm\`
          * **AppImage:** \`chmod +x DesignShop-$VER-linux-x64.AppImage && ./DesignShop-$VER-linux-x64.AppImage\`
          * **Portable Windows:** just run the exe — no installation, settings travel with the folder.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "DesignShop $VER" --notes "$NOTES"
          else
            gh release create "$TAG" --title "DesignShop $VER" --notes "$NOTES" --target "${{ github.sha }}"
          fi
          gh release upload "$TAG" dist-release/* --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
      - name: Also refresh the "latest" tag on main
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Latest build" --notes "Rolling latest build from main."
          else
            gh release create latest --title "Latest build" --notes "Rolling latest build from main." --target "${{ github.sha }}"
          fi
          gh release upload latest dist-release/* --clobber
