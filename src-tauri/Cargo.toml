[package]
name = "designshop"
version = "1.0.0"
description = "DesignShop — a friendly, Photoshop-class editor for thumbnails and social graphics"
authors = ["DesignShop <hello@designshop.app>"]
license = "MIT"
repository = "https://github.com/Manixpcshot/DesignShop"
homepage = "https://github.com/Manixpcshot/DesignShop"
edition = "2021"
rust-version = "1.77"

[lib]
name = "designshop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
rfd = "0.15"
dirs = "5"

[features]
# this feature is used for production builds where `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
